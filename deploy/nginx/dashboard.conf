# Dashboard Angular : https://__DOMAIN__ (www redirigé vers le domaine nu), fichiers
# statiques. Pages légales (dépôt causeo-privacy) sous /privacy/.
# Modèle : setup.sh remplace __DOMAIN__ et l'installe dans /etc/nginx/sites-available/.

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__ www.__DOMAIN__;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://__DOMAIN__$request_uri;
    }
}

# Une seule origine pour le dashboard (CORS, Meta, Google) : www renvoie vers le domaine nu.
server {
    # Syntaxe de nginx 1.24 (Ubuntu 24.04) ; « http2 on; » n'existe qu'à partir de 1.25.1.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.__DOMAIN__;

    ssl_certificate /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    include /etc/nginx/snippets/causeo-ssl.conf;

    return 301 https://__DOMAIN__$request_uri;
}

server {
    # Syntaxe de nginx 1.24 (Ubuntu 24.04) ; « http2 on; » n'existe qu'à partir de 1.25.1.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __DOMAIN__;

    ssl_certificate /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    include /etc/nginx/snippets/causeo-ssl.conf;

    # Lien vers la version en ligne (deploy/dashboard-release.sh) : basculé d'un coup.
    root /var/www/causeo-dashboard/current;
    index index.html;
    charset utf-8;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    access_log /var/log/nginx/causeo-dashboard.access.log;
    error_log /var/log/nginx/causeo-dashboard.error.log;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Application à page unique : toute route inconnue renvoie index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html n'est jamais mis en cache : il pointe vers les fichiers du dernier build.
    # (Un add_header ici remplace ceux du serveur : on les répète.)
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    # Fichiers du build Angular, dont le nom contient un hash : cache long.
    location ~* "-[A-Z0-9]{8}\.(?:js|css)$" {
        expires 1y;
        # Sans « always » : un fichier absent (404) n'est pas marqué immuable.
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Politique de confidentialité et suppression des données (URL déclarées chez Meta).
    location /privacy/ {
        alias /var/www/causeo-privacy/;
        index index.html;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
