# Paramètres TLS communs aux sites Causeo (installé dans /etc/nginx/snippets/).
ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_session_cache shared:CauseoSSL:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;
# Pas d'agrafage OCSP : Let's Encrypt n'a plus de répondeur OCSP depuis 2025.
