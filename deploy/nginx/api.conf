# API Laravel : https://api.__DOMAIN__ (php-fpm, pool « causeo »).
# Modèle : setup.sh remplace __DOMAIN__ et l'installe dans /etc/nginx/sites-available/.

server {
    listen 80;
    listen [::]:80;
    server_name api.__DOMAIN__;

    # Renouvellement des certificats (certbot --webroot).
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # Syntaxe de nginx 1.24 (Ubuntu 24.04) ; « http2 on; » n'existe qu'à partir de 1.25.1.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.__DOMAIN__;

    ssl_certificate /etc/letsencrypt/live/api.__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.__DOMAIN__/privkey.pem;
    include /etc/nginx/snippets/causeo-ssl.conf;

    root /var/www/causeo-api/public;
    index index.php;
    charset utf-8;

    # Médias jusqu'à 16 Mo, documents 10 Mo, captures 5 Mo (voir aussi le pool php-fpm).
    client_max_body_size 20M;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    access_log /var/log/nginx/causeo-api.access.log;
    error_log /var/log/nginx/causeo-api.error.log;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Seul le front controller est exécuté.
    location = /index.php {
        include fastcgi_params; # transmet HTTPS=on, l'IP du client et l'hôte à Laravel
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_pass unix:/run/php/php8.2-fpm-causeo.sock;
        fastcgi_hide_header X-Powered-By;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        # La réponse part avant le traitement IA (fastcgi_finish_request) : ce délai
        # ne concerne que les requêtes ordinaires.
        fastcgi_read_timeout 120s;
    }

    location ~ \.php$ {
        return 404;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
