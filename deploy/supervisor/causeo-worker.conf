; Worker de file d'attente (installé dans /etc/supervisor/conf.d/causeo-worker.conf).
[program:causeo-worker]
process_name=%(program_name)s_%(process_num)02d
command=/usr/bin/php8.2 /var/www/causeo-api/artisan queue:work --tries=3 --sleep=3 --timeout=280 --max-time=3600
directory=/var/www/causeo-api
user=deploy
numprocs=1
autostart=true
autorestart=true
startsecs=5
; Laisser finir le job en cours (--timeout=280) avant d'arrêter le processus.
stopwaitsecs=300
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/var/log/supervisor/causeo-worker.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
