; Worker de file d'attente (installé dans /etc/supervisor/conf.d/causeo-worker.conf).
; Les réponses aux clients passent par la file avec des délais de quelques secondes
; (ReplyToCustomer, SendCustomerReply) : --sleep=1 pour les reprendre à l'heure, et deux
; processus pour qu'une réponse lente de Claude ne retarde pas les autres conversations.
[program:causeo-worker]
process_name=%(program_name)s_%(process_num)02d
command=/usr/bin/php8.2 /var/www/causeo-api/artisan queue:work --tries=3 --sleep=1 --timeout=280 --max-time=3600
directory=/var/www/causeo-api
user=deploy
numprocs=2
autostart=true
autorestart=true
startsecs=5
; Laisser finir le job en cours (--timeout=280) avant d'arrêter le processus.
stopwaitsecs=300
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/var/log/supervisor/causeo-worker.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
