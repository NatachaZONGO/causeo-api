; Limites d'upload de l'API Causeo (installé dans /etc/php/8.2/fpm/conf.d/99-causeo.ini).
; Plus grande limite de l'API : médias 16 Mo (BusinessMediaController) ; documents 10 Mo,
; captures des retours et preuves de paiement 5 Mo. nginx : client_max_body_size 25M.
; Seule source de ces valeurs : le pool causeo ne les redéfinit pas.

upload_max_filesize = 20M
; Le fichier et les autres champs du formulaire.
post_max_size = 25M
memory_limit = 256M
