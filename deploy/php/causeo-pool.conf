; Pool php-fpm de l'API Causeo (installé dans /etc/php/8.2/fpm/pool.d/causeo.conf).
; Il tourne sous l'utilisateur deploy, propriétaire du code et de storage/.

[causeo]
user = deploy
group = deploy

listen = /run/php/php8.2-fpm-causeo.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; Un processus reste occupé pendant le traitement IA lancé après la réponse au
; webhook (afterResponse) : prévoir assez de processus. Environ 60 à 80 Mo chacun ;
; 12 conviennent à un VPS de 4 Go et plus.
pm = dynamic
pm.max_children = 12
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500

; Limite dure (temps réel) d'une requête, traitement après la réponse compris.
; Supérieure au set_time_limit() posé par l'application pour ce traitement.
request_terminate_timeout = 330s

; Les variables viennent du fichier .env de Laravel, pas de l'environnement du pool.
clear_env = yes
catch_workers_output = yes
decorate_workers_output = no

; Requêtes ordinaires : 60 s. php_value (et non php_admin_value) pour que
; set_time_limit() puisse prolonger le traitement après la réponse.
php_value[max_execution_time] = 60
php_admin_value[memory_limit] = 256M
; Médias jusqu'à 16 Mo (nginx : client_max_body_size 20M).
php_admin_value[upload_max_filesize] = 20M
php_admin_value[post_max_size] = 24M
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /var/log/php8.2-fpm-causeo.log
